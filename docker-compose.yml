services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: samo_crm
      POSTGRES_USER: samo
      POSTGRES_PASSWORD: samo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samo -d samo_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://samo:samo@db:5432/samo_crm
      JWT_SECRET: local-docker-secret-change-in-production
      ADMIN_EMAIL: admin@samo.local
      ADMIN_PASSWORD: admin123
      FRONTEND_ORIGIN: http://localhost:3000
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
